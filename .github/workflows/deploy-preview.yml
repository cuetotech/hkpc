name: Build and publish vahope static preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture_static.py
      - .github/workflows/deploy-preview.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vahope-preview-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Capture and normalize public website
        run: python scripts/capture_static.py

      - name: Summarize capture
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("site/capture-report.json").read_text())
          print("## Static preview capture")
          print()
          print(f"- Pages attempted: {r['pages_attempted']}")
          print(f"- Assets attempted: {r['assets_attempted']}")
          print(f"- Files saved: {r['files_saved']}")
          print(f"- Bytes saved: {r['bytes_saved']}")
          print(f"- Capture failures: {r['failure_count']}")
          print(f"- External references inventoried: {len(r['external_references'])}")
          PY

      - name: Publish snapshot to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" HEAD
          cd "$tmp"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$GITHUB_WORKSPACE/site/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish vahope static preview from ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages

      - name: Enable or update GitHub Pages branch source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          body='{"source":{"branch":"gh-pages","path":"/"}}'
          code="$(curl -sS -o /tmp/pages-response.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$api"             -d "$body")"
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code="$(curl -sS -o /tmp/pages-response.json -w '%{http_code}'               -X PUT               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "$api"               -d "$body")"
          fi
          cat /tmp/pages-response.json || true
          echo
          case "$code" in
            200|201|204) ;;
            *) echo "Pages API returned HTTP $code" >&2; exit 1 ;;
          esac

      - name: Verify GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url="https://cuetotech.github.io/hkpc/"
          for i in {1..18}; do
            status="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ] && grep -qi '<html' /tmp/page.html; then
              echo "Preview live at $url" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not return verified HTML during this run." >&2
          exit 1
